<script>
(function(){
  var frame = document.getElementById("profinderFrame");
  function resizeFrame(){
    try{
      var doc = frame.contentWindow.document;
      var h = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight);
      frame.style.height = h + "px";
    }catch(e){}
  }
  frame.addEventListener("load", function(){
    resizeFrame();
    // 中のタブ切替・データ描画などでも高さが変わるので継続的に監視する
    setInterval(resizeFrame, 500);
    try{
      var innerDoc = frame.contentWindow.document;
      if(window.ResizeObserver){
        new ResizeObserver(resizeFrame).observe(innerDoc.body);
      }
    }catch(e){}
  });
  window.addEventListener("resize", resizeFrame);
})();
</script>

<script src="app-common.js"></script>
<script>
(function(){
  const session = requireSession();
  if(!session) return;
  applyUserChip(session);
  renderTopbarNotify(session);
  applyTopbarTimeClass();
  pfCheckProfinderAccess(session.memberNo).then(hasAccess=>{
    if(!hasAccess)window.location.replace("profinder-signup.html");
  });
})();
</script>
