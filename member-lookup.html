<!DOCTYPE html>
<html lang="ja">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../top/style.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-mark"><img src="../top/worldshift-globe.png" alt="worldSHiFT" width="24" height="19"></div>
      <div class="sidebar-brand-text">
        <span class="kicker">SHiFT ADMIN</span>
        <span class="title">world<span class="brand-shift">SH<span class="brand-i">i</span>FT</span><br>Admin Central</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <a href="admin.html" class="sidebar-link" data-tip="管理者画面">
        <span class="sidebar-link-icon"><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.7-7 9-4-1.3-7-4.5-7-9V6l7-3z"></path></svg></span>
        <span class="sidebar-link-label">管理者画面</span>
      </a>
      <a href="member-demo.html" class="sidebar-link" data-tip="会員デモ画面">
        <span class="sidebar-link-icon"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg></span>
        <span class="sidebar-link-label">会員デモ画面</span>
      </a>
      <a href="member-lookup.html" class="sidebar-link active" data-tip="会員指定画面">
        <span class="sidebar-link-icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"></circle><line x1="20" y1="20" x2="15.5" y2="15.5"></line></svg></span>
        <span class="sidebar-link-label">会員指定画面</span>
      </a>
      <a href="../top/top.html" class="sidebar-link" target="_blank" rel="noopener" data-tip="顧客ページ(①)を開く">
        <span class="sidebar-link-icon"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"></path><path d="M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"></path></svg></span>
        <span class="sidebar-link-label">顧客ページを開く</span><svg class="ext-icon" viewBox="0 0 24 24"><path d="M7 17L17 7M7 7h10v10"></path></svg>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg></div>
        <div class="sidebar-user-text">
          <span class="label">ログイン中</span>
          <span class="value">管理者</span>
        </div>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <div class="main-topbar">
      <div class="main-topbar-heading">
        <div class="kicker">LOOKUP</div>
        <h1>会員指定画面</h1>
      </div>
    </div>

    <div class="container page-body">

      <div class="admin-note" style="margin-bottom:20px">
        <span>ⓘ</span>
        <span>会員番号を入力すると、顧客ページ（①）をタブで確認できます。※これは見た目確認用の静的プレビューで、入力した会員番号によって実データが切り替わるものではありません（実データ連携は別途開発が必要です）。</span>
      </div>

      <form class="member-lookup-form" id="lookupForm">
        <input type="text" id="lookupMemberNo" placeholder="会員番号を入力（例：WS-10234）" required>
        <button type="submit" class="copy-btn copy-btn-primary">表示する</button>
        <span class="lookup-status" id="lookupStatus"></span>
      </form>

      <div class="preview-toolbar">
        <div class="preview-tabs pill-group" id="previewTabs"></div>
      </div>

      <div class="preview-frame-wrap">
        <iframe id="previewFrame" title="会員指定プレビュー" style="display:none"></iframe>
        <div class="preview-frame-empty" id="previewEmpty">
          会員番号を入力して「表示する」を押してください
        </div>
      </div>

    </div>
  </main>
</div>

<script src="admin-common.js"></script>
<script>
let currentMemberNo = "";
let currentPageKey = "top";

function updateFrame(){
  const frame = document.getElementById("previewFrame");
  const empty = document.getElementById("previewEmpty");
  if(!currentMemberNo){
    frame.style.display = "none";
    empty.style.display = "flex";
    return;
  }
  const page = CUSTOMER_PAGES.find(function(p){ return p.key === currentPageKey; }) || CUSTOMER_PAGES[0];
  frame.src = "../top/" + page.file;
  frame.style.display = "block";
  empty.style.display = "none";
}

renderPreviewTabs(document.getElementById("previewTabs"), currentPageKey, function(page){
  currentPageKey = page.key;
  if(currentMemberNo) updateFrame();
});

document.getElementById("lookupForm").addEventListener("submit", function(e){
  e.preventDefault();
  const value = document.getElementById("lookupMemberNo").value.trim();
  const statusEl = document.getElementById("lookupStatus");
  if(!value){
    statusEl.textContent = "会員番号を入力してください";
    statusEl.className = "lookup-status is-error";
    return;
  }
  currentMemberNo = value;
  statusEl.textContent = "会員番号「" + value + "」で表示中（見た目確認のみ）";
  statusEl.className = "lookup-status is-active";
  updateFrame();
});
</script>
</body>
</html>
