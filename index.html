<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>

<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ログイン | worldSHiFT Member Central</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=JetBrains+Mono:wght@500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="style.css" rel="stylesheet"/>
</head>
<body>
<div aria-busy="true" aria-live="polite" class="loading-overlay" id="loadingOverlay"><div class="loading-box"><div class="spinner"></div><div class="loading-text" id="loadingText">処理中です</div></div></div>
<div class="container" id="authPage">
<div class="brand">
<div class="brand-mark">
<span class="brand-kicker"><span class="kicker-dot"></span>SHiFT MEMBERS ONLY</span>
<h1 class="brand-title">worldSH<span class="brand-i">i</span>FT Member Central</h1>
<span class="brand-rule"></span>
</div>
</div>
<div class="card auth-card">
<div class="input-group">
<label class="input-label" for="username">会員番号</label>
<input autocomplete="username" id="username" placeholder="Member ID" type="text"/>
</div>
<div class="input-group">
<label class="input-label" for="password">パスワード</label>
<div class="password-wrap">
<input autocomplete="current-password" id="password" placeholder="Password" type="password"/>
<button aria-label="パスワードを表示" class="eye-btn" id="togglePassword" type="button">
<svg class="eye-open" viewbox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
<svg class="eye-off" viewbox="0 0 24 24"><path d="M17.94 17.94A10.94 10.94 0 0112 19c-7 0-11-7-11-7a21.6 21.6 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 7 11 7a21.7 21.7 0 01-2.16 3.19M14.12 14.12a3 3 0 11-4.24-4.24"></path><line x1="1" x2="23" y1="1" y2="23"></line></svg>
</button>
</div>
</div>
<div class="actions">
<button class="action register-btn" type="button">新規登録</button>
<button class="action login-btn" type="button">ログイン</button>
</div>
<div class="message" id="message"></div>
</div>
<div class="powered">Provided by</div>
<img alt="WorldShift" class="logo logo-sm" src="corp.png"/>
</div>

</body>
</html>
